<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin đơn hàng Hương Kid</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff4757; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h3>🛍️ Xác nhận đơn hàng</h3>
    <div class="form-group">
        <label>Tên của Mẹ/Bé:</label>
        <input type="text" id="name" placeholder="Ví dụ: Mẹ Bé Bo">
    </div>
    <div class="form-group">
        <label>Số điện thoại:</label>
        <input type="tel" id="phone" placeholder="Bắt buộc 10 số">
    </div>
    <div class="form-group">
        <label>Địa chỉ nhận hàng:</label>
        <input type="text" id="address" placeholder="Số nhà, tên đường, tỉnh thành...">
    </div>
    <button onclick="submitForm()">XÁC NHẬN GỬI</button>

    <script>
        // 1. TÍCH HỢP MESSENGER EXTENSIONS SDK
        window.extAsyncInit = function() {
            console.log("Facebook Messenger Extension SDK đã sẵn sàng.");
        };

        (function(d, s, id){
          var js, fjs = d.getElementsByTagName(s)[0];
          if (d.getElementById(id)) {return;}
          js = d.createElement(s); js.id = id;
          js.src = "//connect.facebook.net/en_US/messenger.Extensions.js";
          fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'Messenger'));

        // Hàm hỗ trợ đóng cửa sổ bằng mọi cách có thể
        function forceCloseWebview() {
            if (window.MessengerExtensions) {
                MessengerExtensions.requestCloseBrowser(function success() {
                    console.log("Đóng Webview thành công qua SDK");
                }, function error(err) {
                    console.error("Lỗi SDK, chuyển hướng sang phương thức dự phòng:", err);
                    window.close();
                    if(window.parent) window.parent.close();
                });
            } else {
                window.close();
                if(window.parent) window.parent.close();
            }
        }

        // 2. HÀM XỬ LÝ GỬI ĐƠN HÀNG
        async function submitForm() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!name || !phone || !address) {
                alert("Mẹ vui lòng điền đầy đủ Tên, SĐT và Địa chỉ để em lên đơn nhen! ❤️");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');

            if (!userId) {
                alert("Không tìm thấy mã người dùng. Mẹ vui lòng mở lại link từ Messenger nhé!");
                return;
            }

            const btn = document.querySelector('button');
            btn.innerText = "⏳ ĐANG GỬI ĐƠN...";
            btn.disabled = true;

            try {
                // 3. GỬI DỮ LIỆU VỀ SERVER NODE.JS
                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, name, phone, address })
                });

                const result = await response.json();

                if (result.success) {
                    // ĐÃ BỎ LỆNH ALERT() Ở ĐÂY ĐỂ TRÁNH BỊ KHỰN LẠI
                    // 4. Gọi hàm đóng cửa sổ lập tức
                    forceCloseWebview();
                } else {
                    alert("⚠️ Có lỗi xảy ra: " + result.message);
                    btn.innerText = "XÁC NHẬN GỬI";
                    btn.disabled = false;
                }

            } catch (error) {
                console.error("Lỗi kết nối:", error);
                alert("❌ Lỗi kết nối mạng hoặc server bận, Mẹ thử lại giúp em nhen!");
                btn.innerText = "XÁC NHẬN GỬI";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
