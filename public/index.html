<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hương Kid - Shop Bé Trai</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thêm một chút CSS để bảng Trace trông ngầu hơn */
        #debug-area {
            margin: 10px;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            display: none; /* Mặc định ẩn, sẽ hiện khi có dữ liệu */
        }
        #diagnostic-box {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin: 0;
            white-space: pre; /* Giữ nguyên định dạng khung của Đạt */
            overflow-x: auto; /* Cho phép cuộn ngang nếu khung quá rộng */
            line-height: 1.3;
        }
        .debug-title {
            color: #ff4757;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <header>HƯƠNG KID - SHOP BÉ TRAI</header>

    <div id="chat-box">
        <div class="msg bot">Dạ shop Hương Kid chào Bạn! Bạn cần em tư vấn mẫu nào hay xem giá mẫu mô rứa ạ?</div>
    </div>

    <div id="debug-area">
        <div class="debug-title">🔍 Hệ Thống Kiểm Soát Lộ Trình</div>
        <pre id="diagnostic-box"></pre>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Nhắn mẫu SP hoặc SĐT..." onkeypress="handleKey(event)">
        <button id="send-btn" onclick="sendMsg()">➔</button>
    </div>

    <script src="chat.js"></script>
</body>
</html>
